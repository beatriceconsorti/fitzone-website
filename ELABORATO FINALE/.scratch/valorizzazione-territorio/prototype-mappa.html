<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PROTOTIPO — Come si esplora la mappa</title>
    <!--
      Three variants of map exploration, switchable via ?variant=, throwaway for ticket 09.
      OSM Buildings 4.x WebGL (tilt 3D). Edifici con Evento in corso colorati.
      A = card sul tap + pulsante globale Proponi
      B = elenco + mappa, Proponi nell’intestazione
      C = bottom sheet sul pin, Proponi da quel Luogo
      Nomi di semina: stand-in finché il ticket 10 non elenca i pin veri.
    -->
    <link rel="stylesheet" href="https://cdn.osmbuildings.org/4.1.1/OSMBuildings.css" />
    <script src="https://cdn.osmbuildings.org/4.1.1/OSMBuildings.js"></script>
    <style>
      :root {
        --ink: #3f3a36;
        --muted: #7a736c;
        --paper: #f7f1e8;
        --line: #e2d8cc;
        --event: #c45c1a;
        --soon: #eab308;
        --empty: #57534e;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; font-family: Georgia, "Times New Roman", serif; color: var(--ink); background: var(--paper); }
      body { display: flex; flex-direction: column; }
      .city-bar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px 28px;
        flex-wrap: wrap;
        padding: 12px 20px 14px;
        background: #f3ebe2;
        border-bottom: 1px solid var(--line);
        z-index: 2000;
      }
      body:not([data-variant="A"]) .city-bar { display: none; }
      .city-bar-lead { min-width: 12rem; }
      .proto-mark {
        margin: 0 0 4px;
        font-family: ui-monospace, monospace;
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .city-bar h1 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 400;
        letter-spacing: 0.01em;
      }
      .city-bar-line {
        margin: 3px 0 0;
        font-family: system-ui, sans-serif;
        font-size: 0.82rem;
        color: var(--muted);
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        margin: 0;
        padding: 0;
        list-style: none;
        font-family: system-ui, sans-serif;
        font-size: 0.78rem;
        color: var(--muted);
      }
      .legend li { display: flex; align-items: center; gap: 7px; }
      .swatch {
        width: 11px; height: 11px; border-radius: 2px;
        box-shadow: inset 0 0 0 1px rgba(63, 58, 54, 0.12);
      }
      .swatch-now { background: #ff4d00; }
      .swatch-soon { background: #eab308; }
      .swatch-none { background: #f6f3ee; }
      .city-proponi {
        margin-left: auto;
        border: 1px solid var(--ink);
        background: transparent;
        color: var(--ink);
        font-family: system-ui, sans-serif;
        font-size: 0.85rem;
        padding: 8px 14px;
        cursor: pointer;
        border-radius: 2px;
      }
      .city-proponi:hover { background: var(--ink); color: var(--paper); }
      #app { position: relative; flex: 1; min-height: 0; width: 100%; }
      .map-stage { position: relative; width: 100%; height: 100%; }
      #map { width: 100%; height: 100%; background: #ebe4dc; min-height: 240px; cursor: pointer; }
      #map .osmb-attribution,
      #map .attribution {
        font-family: system-ui, sans-serif !important;
        font-size: 10px !important;
        color: var(--muted) !important;
        background: transparent !important;
        opacity: 0.7;
      }
      .ev { margin: 10px 0 0; padding-top: 10px; border-top: 1px solid var(--line); }
      .ev:first-of-type { margin-top: 12px; }
      .ev-title { font-size: 1rem; }
      .ev-desc {
        margin: 5px 0 0; font-family: system-ui, sans-serif;
        font-size: 0.85rem; color: var(--muted); line-height: 1.4;
      }
      .when {
        margin: 6px 0 0;
        font-family: system-ui, sans-serif;
        font-size: 0.78rem;
        color: var(--muted);
      }

      /* B */
      .b-wrap { display: grid; grid-template-columns: 280px 1fr; height: 100%; }
      .b-side { overflow: auto; border-right: 1px solid var(--line); background: var(--paper); }
      .b-head { padding: 14px 14px 8px; border-bottom: 1px solid var(--line); }
      .b-head h1 { margin: 0 0 8px; font-size: 1.2rem; font-weight: 600; }
      .b-head button {
        font-family: system-ui, sans-serif; font-size: 0.8rem;
        border: 1px solid var(--ink); background: #fff; padding: 8px 10px; cursor: pointer; width: 100%;
      }
      .b-item {
        display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line);
        background: transparent; padding: 12px 14px; cursor: pointer; font-family: Georgia, serif;
      }
      .b-item.is-on { background: #fff7ed; }
      .b-item .name { font-size: 1rem; }
      .b-item .meta { font-size: 0.75rem; color: var(--muted); font-family: system-ui, sans-serif; margin-top: 4px; }
      .b-map { position: relative; height: 100%; min-height: 0; }

      /* C */
      .c-hint {
        position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
        z-index: 500; background: #fff; padding: 8px 12px; font-size: 0.85rem;
        font-family: system-ui, sans-serif; border: 1px solid var(--line); white-space: nowrap;
      }
      .sheet {
        position: absolute; left: 0; right: 0; bottom: 0; z-index: 600;
        background: #fff; border-top: 2px solid var(--ink);
        max-height: 48%; overflow: auto; padding: 16px 16px 20px;
        display: none;
      }
      .sheet.is-open { display: block; }
      .sheet h2 { margin: 0 0 6px; font-size: 1.25rem; }
      .sheet .when { font-family: system-ui, sans-serif; font-size: 0.85rem; color: var(--muted); margin: 0 0 10px; }
      .sheet ul { margin: 0 0 12px; padding-left: 1.1rem; }
      .sheet button, .sheet .ghost {
        font-family: system-ui, sans-serif; font-size: 0.9rem; padding: 10px 12px;
        border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; width: 100%;
      }
      .sheet .ghost { background: #fff; color: var(--ink); margin-top: 8px; }

      .popup-ev { margin: 6px 0 0; padding: 0; list-style: none; font-family: system-ui, sans-serif; font-size: 0.8rem; }
      .popup-ev li { margin: 4px 0; }
      .tag {
        display: inline-block;
        font-family: system-ui, sans-serif;
        font-size: 0.65rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin: 0 0 4px;
      }
      .tag-now { color: var(--event); }
      .tag-soon { color: var(--soon); }

      .luogo-card {
        position: absolute; right: 18px; top: 18px; left: auto; bottom: auto; z-index: 550;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 4px;
        border-left: 4px solid var(--luogo, var(--event));
        padding: 16px 16px 18px;
        width: min(24rem, calc(100% - 36px));
        display: none;
        max-height: min(52%, calc(100% - 36px));
        overflow: auto;
        box-shadow: 0 10px 28px rgba(63, 58, 54, 0.12);
      }
      .luogo-card.is-open { display: block; }
      .luogo-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
      .luogo-card h2 { margin: 0; font-size: 1.28rem; font-weight: 400; line-height: 1.2; }
      .luogo-kind {
        margin: 4px 0 0;
        font-family: system-ui, sans-serif;
        font-size: 0.75rem;
        color: var(--muted);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .luogo-close {
        flex: 0 0 auto;
        width: 28px; height: 28px;
        margin: -4px -6px 0 0;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 1.35rem;
        line-height: 1;
        cursor: pointer;
      }
      .luogo-close:hover { color: var(--ink); }

      .event-marks {
        position: absolute; inset: 0; z-index: 520;
        pointer-events: none;
        overflow: hidden;
      }
      .event-mark {
        position: absolute; left: 0; top: 0;
        display: flex; flex-direction: column; align-items: center;
        border: 0; padding: 0; margin: 0;
        background: transparent;
        cursor: pointer;
        pointer-events: auto;
        transform: translate(-50%, -100%);
      }
      .event-mark-ball {
        width: 13px; height: 13px;
        border-radius: 50%;
        background: var(--mark);
        box-shadow: 0 0 0 2px #fff, 0 2px 7px rgba(63, 58, 54, 0.28);
      }
      .event-mark-dots {
        width: 3px;
        height: 26px;
        margin-top: 2px;
        background: repeating-linear-gradient(
          to bottom,
          var(--mark) 0 3px,
          transparent 3px 6px
        );
      }

      .modal {
        display: none; position: absolute; inset: 0; z-index: 800;
        background: rgba(63, 58, 54, 0.38); align-items: center; justify-content: center;
      }
      .modal.is-open { display: flex; }
      .modal-card {
        background: var(--paper); padding: 22px 22px 20px; width: min(22rem, 92%);
        border: 1px solid var(--line);
        border-radius: 4px;
        box-shadow: 0 12px 32px rgba(63, 58, 54, 0.16);
      }
      .modal-card h2 { margin: 0 0 8px; font-size: 1.2rem; font-weight: 400; }
      .modal-card p { margin: 0 0 16px; font-size: 0.9rem; color: var(--muted); font-family: system-ui, sans-serif; }
      .modal-card button {
        font-family: system-ui, sans-serif;
        padding: 8px 14px;
        cursor: pointer;
        border: 1px solid var(--ink);
        background: transparent;
        color: var(--ink);
        border-radius: 2px;
      }

      @media (max-width: 720px) {
        .b-wrap { grid-template-columns: 1fr; grid-template-rows: 38% 1fr; }
        .b-side { border-right: 0; border-bottom: 1px solid var(--line); }
        .city-proponi { margin-left: 0; }
        .luogo-card { right: 12px; top: auto; bottom: 16px; }
      }
    </style>
  </head>
  <body>
    <header class="city-bar">
      <div class="city-bar-lead">
        <p class="proto-mark">Prototipo · non è il Sito</p>
        <h1>Ascoli Piceno</h1>
        <p class="city-bar-line">Cosa accade in questi giorni</p>
      </div>
      <ul class="legend" aria-label="Legenda">
        <li><i class="swatch swatch-now" aria-hidden="true"></i> In corso</li>
        <li><i class="swatch swatch-soon" aria-hidden="true"></i> In arrivo</li>
        <li><i class="swatch swatch-none" aria-hidden="true"></i> Nessun Evento</li>
      </ul>
      <button type="button" class="city-proponi" id="proponi">Proponi un Evento</button>
    </header>
    <div id="app"></div>

    <script>
      const VARIANTS = [
        { key: "A", name: "Popup + Proponi globale" },
        { key: "B", name: "Elenco + mappa" },
        { key: "C", name: "Bottom sheet sul pin" },
      ];
      const TODAY = "2026-09-11";
      const LUOGHI = [
        {
          id: "popolo",
          nome: "Piazza del Popolo",
          suolo: "piazza",
          lat: 42.85472,
          lng: 13.57505,
          eventi: [
            {
              titolo: "Mercato del sabato",
              data: "2026-09-12",
              descrizione:
                "Banchi di alimentari e artigianato sotto i portici, dal mattino a pranzo.",
            },
          ],
        },
        {
          id: "arringo",
          nome: "Piazza Arringo",
          suolo: "piazza",
          lat: 42.85355,
          lng: 13.57685,
          eventi: [
            {
              titolo: "Letture in piazza",
              data: "2026-09-11",
              descrizione:
                "Letture ad alta voce davanti al battistero, aperte a chi passa.",
            },
          ],
        },
        {
          id: "cecco",
          nome: "Ponte di Cecco",
          suolo: "ponte",
          lat: 42.85435,
          lng: 13.58055,
          eventi: [],
        },
        {
          id: "teatro",
          nome: "Teatro Ventidio Basso",
          suolo: "edificio",
          lat: 42.85415,
          lng: 13.57355,
          eventi: [
            {
              titolo: "Prova aperta",
              data: "2026-09-20",
              descrizione:
                "Il teatro apre una prova di palcoscenico: si entra, si ascolta, si esce.",
            },
          ],
        },
        {
          id: "duomo",
          nome: "Cattedrale di Sant'Emidio",
          suolo: "chiesa",
          lat: 42.85325,
          lng: 13.57705,
          eventi: [
            {
              titolo: "Concerto d'organo",
              data: "2026-09-18",
              descrizione:
                "Musica per organo nella navata, ingresso libero fino a esaurimento posti.",
            },
          ],
        },
        {
          id: "francesco",
          nome: "Piazza San Francesco",
          suolo: "piazza",
          lat: 42.85535,
          lng: 13.57415,
          eventi: [
            {
              titolo: "Fiera dell'artigianato",
              data: "2026-09-19",
              descrizione:
                "Banchi di legno, ceramica e tessuti intorno alla piazza.",
            },
          ],
        },
        {
          id: "giardini",
          nome: "Giardini di Piazza Roma",
          suolo: "giardino",
          lat: 42.85395,
          lng: 13.57285,
          eventi: [
            {
              titolo: "Musica sotto gli alberi",
              data: "2026-09-14",
              descrizione:
                "Un piccolo ensemble suona al tramonto tra i viali.",
            },
          ],
        },
      ];

      const state = {
        variant: "A",
        selectedId: null,
        formOpen: false,
        formFrom: null,
      };

      function hasInCorso(luogo) {
        return luogo.eventi.some((e) => e.data === TODAY);
      }
      function hasFuturi(luogo) {
        return luogo.eventi.some((e) => e.data > TODAY);
      }
      function pinKind(luogo) {
        if (hasInCorso(luogo)) return "in-corso";
        if (luogo.eventi.length) return "con-eventi";
        return "vuoto";
      }
      function luogoById(id) {
        return LUOGHI.find((l) => l.id === id);
      }
      function etichettaData(data) {
        if (data === TODAY) return "in corso";
        if (data > TODAY) return "in arrivo";
        return "passato";
      }
      function formatGiorno(iso) {
        const mesi = [
          "gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno",
          "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre",
        ];
        const p = iso.split("-");
        const d = parseInt(p[2], 10);
        const m = parseInt(p[1], 10);
        if (!d || !m) return iso;
        return d + " " + mesi[m - 1];
      }
      function suoloLabel(suolo) {
        if (!suolo) return "";
        return suolo.charAt(0).toUpperCase() + suolo.slice(1);
      }

      function currentVariant() {
        const q = new URLSearchParams(location.search).get("variant");
        const h = new URLSearchParams(location.hash.replace(/^#/, "")).get("variant");
        const p = q || h || "A";
        return VARIANTS.some((v) => v.key === p) ? p : "A";
      }
      function setVariant(key) {
        const url = new URL(location.href);
        url.searchParams.set("variant", key);
        url.hash = "variant=" + key;
        history.replaceState({}, "", url);
        state.variant = key;
        state.selectedId = null;
        state.formOpen = false;
        state.formFrom = null;
        render();
      }
      function cycle(dir) {
        const i = VARIANTS.findIndex((v) => v.key === state.variant);
        const n = (i + dir + VARIANTS.length) % VARIANTS.length;
        setVariant(VARIANTS[n].key);
      }

      function paintState() {}

      function listaEventi(luogo) {
        if (!luogo.eventi.length) return "<p class='when'>Nessun Evento su questo Luogo.</p>";
        return luogo.eventi
          .map((e) => {
            const k = etichettaData(e.data);
            const cls = k === "in corso" ? "tag-now" : "tag-soon";
            const desc = e.descrizione
              ? "<p class='ev-desc'>" + e.descrizione + "</p>"
              : "";
            return (
              "<div class='ev'><span class='tag " +
              cls +
              "'>" +
              k +
              "</span><div class='ev-title'>" +
              e.titolo +
              "</div>" +
              desc +
              "<p class='when'>" +
              formatGiorno(e.data) +
              "</p></div>"
            );
          })
          .join("");
      }

      function mapStageHtml() {
        return '<div class="map-stage"><div id="map"></div><div class="event-marks" id="event-marks"></div></div>';
      }

      const COLOR_IN_CORSO = "#ff4d00";
      const COLOR_IN_ARRIVO = "#eab308";

      function coloreLuogo(luogo) {
        if (!luogo) return COLOR_IN_CORSO;
        if (hasInCorso(luogo)) return COLOR_IN_CORSO;
        if (luogo.eventi && luogo.eventi.length) return COLOR_IN_ARRIVO;
        return COLOR_CITTA;
      }

      function rememberBuilding(id, luogo) {
        if (!id || !luogo) return;
        const key = String(id);
        const raw = key.replace(/^osm-w/i, "");
        buildingTint.toLuogo[key] = luogo.id;
        buildingTint.toLuogo[raw] = luogo.id;
        buildingTint.color[key] = coloreLuogo(luogo);
        buildingTint.color[raw] = coloreLuogo(luogo);
      }

      function metersToLuogo(lng, lat, luogo) {
        const dy = (lat - luogo.lat) * 110540;
        const dx = (lng - luogo.lng) * 111320 * Math.cos((lat * Math.PI) / 180);
        return Math.hypot(dx, dy);
      }

      const EVENT_BUILDING_MAX_M = 80;

      const COLOR_CITTA = "rgb(250, 250, 248)";
      const BUILDING_TILES =
        "https://{s}.data.osmbuildings.org/0.2/anonymous/tile/{z}/{x}/{y}.json";
      const BUILDING_CACHE_KEY = "ascoli-buildings-v3";
      const buildingTint = { toLuogo: {}, color: {} };
      let osmb = null;
      let onLuogoClick = null;
      let buildingTiles = null;
      let detailedLayer = null;
      let eventLayer = null;
      let eventMarkers = [];
      window.__buildingsAppear = {
        t0: performance.now(),
        osmbMs: null,
        sceneReadyMs: null,
        how: null,
        overpassMs: null,
        geojsonMs: null,
        count: 0,
        fallbackTiles: false,
      };

      function emptyAppear(now) {
        return {
          t0: now,
          osmbMs: null,
          sceneReadyMs: null,
          how: null,
          overpassMs: null,
          geojsonMs: null,
          count: 0,
          fallbackTiles: false,
        };
      }

      function markBuildingsScene(how) {
        const a = window.__buildingsAppear;
        if (!a || a.sceneReadyMs != null) return;
        a.sceneReadyMs = performance.now();
        a.how = how;
      }

      function readBuildingCache() {
        try {
          const raw = localStorage.getItem(BUILDING_CACHE_KEY);
          if (!raw) return null;
          const fc = JSON.parse(raw);
          if (!fc || !fc.features || !fc.features.length) return null;
          return fc;
        } catch (err) {
          return null;
        }
      }

      function writeBuildingCache(fc) {
        try {
          localStorage.setItem(BUILDING_CACHE_KEY, JSON.stringify(fc));
        } catch (err) {}
      }

      function dropBuildingTiles() {
        if (buildingTiles && typeof buildingTiles.destroy === "function") {
          try {
            buildingTiles.destroy();
          } catch (err) {}
        }
        buildingTiles = null;
        if (osmb) osmb.dataGrid = null;
      }

      function paintEventColors(fc) {
        const features = fc.features || [];
        buildingTint.toLuogo = {};
        buildingTint.color = {};
        eventMarkers = [];
        features.forEach((f) => {
          if (!f.properties) return;
          f.properties.color = COLOR_CITTA;
          f.properties.roofColor = COLOR_CITTA;
        });
        const luoghi = LUOGHI.filter((l) => pinKind(l) !== "vuoto");
        const pairs = [];
        features.forEach((f) => {
          if (!f.id || String(f.id).indexOf("-cupola") !== -1) return;
          const ring = f.geometry && f.geometry.coordinates && f.geometry.coordinates[0];
          if (!ring) return;
          const c = ringCentroid(ring);
          luoghi.forEach((luogo) => {
            const d = metersToLuogo(c[0], c[1], luogo);
            if (d <= EVENT_BUILDING_MAX_M) pairs.push({ d: d, f: f, luogo: luogo, c: c });
          });
        });
        pairs.sort((a, b) => a.d - b.d);
        const usedFeature = {};
        const usedLuogo = {};
        pairs.forEach((p) => {
          const fid = String(p.f.id);
          if (usedFeature[fid] || usedLuogo[p.luogo.id]) return;
          usedFeature[fid] = true;
          usedLuogo[p.luogo.id] = true;
          const col = coloreLuogo(p.luogo);
          p.f.properties.color = col;
          p.f.properties.roofColor = col;
          rememberBuilding(p.f.id, p.luogo);
          eventMarkers.push({
            id: p.luogo.id,
            lng: p.c[0],
            lat: p.c[1],
            alt: Math.max(16, p.f.properties.height || 16) + 1,
            color: col,
          });
          features.forEach((part) => {
            if (String(part.id) !== fid + "-cupola" || !part.properties) return;
            part.properties.color = col;
            part.properties.roofColor = col;
            rememberBuilding(part.id, p.luogo);
          });
        });
        return fc;
      }

      function mountEventMarks() {
        const layer = document.getElementById("event-marks");
        if (!layer) return;
        layer.innerHTML = "";
        eventMarkers.forEach((m) => {
          const luogo = luogoById(m.id);
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "event-mark";
          btn.style.setProperty("--mark", m.color);
          btn.setAttribute("aria-label", luogo ? luogo.nome : "Evento");
          btn.innerHTML =
            '<span class="event-mark-ball"></span><span class="event-mark-dots" aria-hidden="true"></span>';
          btn.onclick = (e) => {
            e.stopPropagation();
            if (luogo && onLuogoClick) onLuogoClick(luogo);
          };
          layer.appendChild(btn);
        });
        syncEventMarks();
      }

      function syncEventMarks() {
        if (!osmb || typeof osmb.project !== "function") return;
        const layer = document.getElementById("event-marks");
        if (!layer) return;
        const size = osmb.getSize ? osmb.getSize() : null;
        const h = size && (size.height || size[1]) ? size.height || size[1] : 2000;
        const w = size && (size.width || size[0]) ? size.width || size[0] : 2000;
        const kids = layer.children;
        for (let i = 0; i < eventMarkers.length; i++) {
          const m = eventMarkers[i];
          const el = kids[i];
          if (!el) continue;
          const p = osmb.project(m.lat, m.lng, m.alt);
          if (!p || p.x == null || p.y == null || p.x < -40 || p.x > w + 40 || p.y < -60 || p.y > h + 40) {
            el.style.visibility = "hidden";
            continue;
          }
          el.style.visibility = "visible";
          el.style.transform =
            "translate(" + Math.round(p.x) + "px," + Math.round(p.y) + "px) translate(-50%, -100%)";
        }
      }

      function dropEventBeacons() {
        if (eventLayer && typeof eventLayer.destroy === "function") {
          try {
            eventLayer.destroy();
          } catch (err) {}
        }
        eventLayer = null;
      }

      function addEventBeacons() {
        if (!osmb) return;
        dropEventBeacons();
        eventMarkers = [];
        const features = LUOGHI.filter((luogo) => pinKind(luogo) !== "vuoto").map((luogo) => {
          const color = coloreLuogo(luogo);
          const d = luogo.suolo === "piazza" || luogo.suolo === "giardino" ? 0.00014 : 0.00009;
          const h = hasInCorso(luogo) ? 28 : 22;
          const id = "ev-" + luogo.id;
          rememberBuilding(id, luogo);
          eventMarkers.push({
            id: luogo.id,
            lng: luogo.lng,
            lat: luogo.lat,
            alt: h + 1,
            color: color,
          });
          return {
            type: "Feature",
            id: id,
            properties: {
              height: h,
              color: color,
              roofColor: color,
              roofShape: "gabled",
              roofHeight: 6,
              roofDirection: 90,
            },
            geometry: {
              type: "Polygon",
              coordinates: [
                [
                  [luogo.lng - d, luogo.lat - d],
                  [luogo.lng + d, luogo.lat - d],
                  [luogo.lng + d, luogo.lat + d],
                  [luogo.lng - d, luogo.lat + d],
                  [luogo.lng - d, luogo.lat - d],
                ],
              ],
            },
          };
        });
        if (!features.length) return;
        eventLayer = osmb.addGeoJSON(
          { type: "FeatureCollection", features: features },
          { fadeIn: false }
        );
        mountEventMarks();
      }

      function showDetailedBuildings(fc) {
        if (!osmb || !fc || !fc.features || !fc.features.length) return;
        dropBuildingTiles();
        dropEventBeacons();
        if (detailedLayer && typeof detailedLayer.destroy === "function") {
          try {
            detailedLayer.destroy();
          } catch (err) {}
        }
        detailedLayer = osmb.addGeoJSON(paintEventColors(fc), { fadeIn: false });
        mountEventMarks();
        markBuildingsScene("geojson");
        if (window.__buildingsAppear) {
          window.__buildingsAppear.geojsonMs = performance.now();
          window.__buildingsAppear.count = fc.features.length;
        }
      }

      function wayRing(el) {
        const pts = el.geometry || [];
        const coords = pts.map((p) => [p.lon, p.lat]);
        if (!coords.length) return null;
        const a = coords[0];
        const b = coords[coords.length - 1];
        if (a[0] !== b[0] || a[1] !== b[1]) coords.push([a[0], a[1]]);
        if (coords.length < 4) return null;
        return coords;
      }

      function ringCentroid(ring) {
        let x = 0;
        let y = 0;
        const n = ring.length - 1;
        for (let i = 0; i < n; i++) {
          x += ring[i][0];
          y += ring[i][1];
        }
        return [x / n, y / n];
      }

      function ringBBox(ring) {
        let minX = Infinity;
        let minY = Infinity;
        let maxX = -Infinity;
        let maxY = -Infinity;
        for (let i = 0; i < ring.length - 1; i++) {
          minX = Math.min(minX, ring[i][0]);
          minY = Math.min(minY, ring[i][1]);
          maxX = Math.max(maxX, ring[i][0]);
          maxY = Math.max(maxY, ring[i][1]);
        }
        return { minX: minX, minY: minY, maxX: maxX, maxY: maxY };
      }

      function orientedRect(ring) {
        let best = 0;
        let ax = 1;
        let ay = 0;
        for (let i = 0; i < ring.length - 1; i++) {
          const dx = ring[i + 1][0] - ring[i][0];
          const dy = ring[i + 1][1] - ring[i][1];
          const len = Math.hypot(dx, dy);
          if (len > best) {
            best = len;
            ax = dx / len;
            ay = dy / len;
          }
        }
        const px = -ay;
        const py = ax;
        let minA = Infinity;
        let maxA = -Infinity;
        let minP = Infinity;
        let maxP = -Infinity;
        for (let i = 0; i < ring.length - 1; i++) {
          const a = ring[i][0] * ax + ring[i][1] * ay;
          const p = ring[i][0] * px + ring[i][1] * py;
          minA = Math.min(minA, a);
          maxA = Math.max(maxA, a);
          minP = Math.min(minP, p);
          maxP = Math.max(maxP, p);
        }
        function pt(a, p) {
          return [a * ax + p * px, a * ay + p * py];
        }
        const rect = [pt(minA, minP), pt(maxA, minP), pt(maxA, maxP), pt(minA, maxP)];
        rect.push(rect[0]);
        return rect;
      }

      function roofDirectionOf(tags, ring) {
        const raw = String(tags["roof:direction"] || "");
        const num = parseFloat(raw);
        if (!isNaN(num) && raw !== "") return num;
        const compass = {
          N: 0,
          NNE: 22.5,
          NE: 45,
          ENE: 67.5,
          E: 90,
          ESE: 112.5,
          SE: 135,
          SSE: 157.5,
          S: 180,
          SSW: 202.5,
          SW: 225,
          WSW: 247.5,
          W: 270,
          WNW: 292.5,
          NW: 315,
          NNW: 337.5,
        };
        if (compass[raw.toUpperCase()] != null) return compass[raw.toUpperCase()];
        let best = 0;
        let bearing = 90;
        for (let i = 0; i < ring.length - 1; i++) {
          const dx = ring[i + 1][0] - ring[i][0];
          const dy = ring[i + 1][1] - ring[i][1];
          const len = dx * dx + dy * dy;
          if (len > best) {
            best = len;
            let deg = (Math.atan2(dx, dy) * 180) / Math.PI;
            if (deg < 0) deg += 360;
            bearing = (deg + 90) % 360;
          }
        }
        return bearing;
      }

      function mapRoofShape(raw) {
        const s = String(raw || "").toLowerCase();
        if (!s) return "";
        if (s === "pyramidal") return "pyramid";
        if (s === "hipped" || s === "half-hipped") return "gabled";
        return s;
      }

      function isChurch(tags) {
        const b = (tags.building || "") + " " + (tags["building:part"] || "");
        const n = tags.name || "";
        return (
          tags.amenity === "place_of_worship" ||
          /church|cathedral|chapel|basilica/i.test(b) ||
          /chiesa|duomo|cattedrale/i.test(n)
        );
      }

      function isHouse(tags) {
        const b = tags.building || "";
        return /^(house|detached|terrace|semidetached_house|bungalow|villa|residential)$/i.test(
          b
        );
      }

      function shortSideMeters(ring) {
        const bb = ringBBox(ring);
        const midLat = (bb.minY + bb.maxY) / 2;
        const dlon =
          (bb.maxX - bb.minX) * 111320 * Math.cos((midLat * Math.PI) / 180);
        const dlat = (bb.maxY - bb.minY) * 110540;
        return Math.min(dlon, dlat);
      }

      function pitchHeight(ring, minH) {
        const w = shortSideMeters(ring);
        return Math.max(minH, Math.min(8.5, w * 0.33));
      }

      function needsRidge(shape) {
        return (
          shape === "gabled" ||
          shape === "skillion" ||
          shape === "gambrel" ||
          shape === "mansard"
        );
      }

      function modelProperties(tags, ring) {
        const levels = parseFloat(tags["building:levels"]) || 0;
        const taggedHeight = parseFloat(tags.height) || 0;
        let roofShape = mapRoofShape(tags["roof:shape"]);
        let roofHeight = parseFloat(tags["roof:height"]) || 0;
        let walls = taggedHeight;
        let color = COLOR_CITTA;
        let roofColor = COLOR_CITTA;
        if (isChurch(tags)) {
          if (!walls) walls = /duomo|cattedrale/i.test(tags.name || "") ? 22 : 12;
          if (!roofShape) roofShape = "gabled";
          if (!roofHeight) roofHeight = pitchHeight(ring, Math.max(5.5, walls * 0.28));
        } else if (isHouse(tags)) {
          if (!walls) walls = Math.max(6.5, (levels || 2) * 3.1);
          if (!roofShape) roofShape = "gabled";
          if (!roofHeight) roofHeight = pitchHeight(ring, 3.2);
        } else if (/apartments/i.test(tags.building || "")) {
          if (!walls) walls = Math.max(12, (levels || 4) * 3.1);
          if (!roofShape) roofShape = levels > 5 ? "flat" : "gabled";
          if (!roofHeight && roofShape !== "flat") roofHeight = pitchHeight(ring, 3);
        } else {
          if (!walls) walls = Math.max(8, (levels || 3) * 3.1);
          if (!roofShape) roofShape = levels <= 4 ? "gabled" : "flat";
          if (!roofHeight && roofShape !== "flat") roofHeight = pitchHeight(ring, 3);
        }
        const height = taggedHeight
          ? taggedHeight
          : walls + (roofShape === "flat" ? 0 : roofHeight);
        if (taggedHeight && roofHeight) {
          roofHeight = Math.min(roofHeight, taggedHeight * 0.45);
        }
        const props = { height: height, color: color, roofColor: roofColor };
        if (levels) props.levels = levels;
        if (roofShape) props.roofShape = roofShape;
        if (roofHeight) props.roofHeight = roofHeight;
        if (needsRidge(roofShape)) props.roofDirection = roofDirectionOf(tags, ring);
        if (tags.min_height) props.minHeight = parseFloat(tags.min_height);
        return props;
      }

      function churchCupola(ring, baseHeight, id) {
        const c = ringCentroid(ring);
        const d = 0.000045;
        const sq = [
          [c[0] - d, c[1] - d],
          [c[0] + d, c[1] - d],
          [c[0] + d, c[1] + d],
          [c[0] - d, c[1] + d],
          [c[0] - d, c[1] - d],
        ];
        return {
          type: "Feature",
          id: id + "-cupola",
          properties: {
            height: baseHeight + 10,
            minHeight: Math.max(0, baseHeight - 0.4),
            roofShape: "dome",
            roofHeight: 9,
            color: COLOR_CITTA,
            roofColor: COLOR_CITTA,
          },
          geometry: { type: "Polygon", coordinates: [sq] },
        };
      }

      function footprintForRoof(ring, tags) {
        if (isChurch(tags)) return ring;
        if (ring.length - 1 > 8) return orientedRect(ring);
        return ring;
      }

      function loadDetailedModels() {
        const q =
          '[out:json][timeout:25];(way["building"](42.851,13.570,42.857,13.582);way["building:part"](42.851,13.570,42.857,13.582););out geom;';
        const urls = [
          "https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(q),
          "https://overpass.kumi.systems/api/interpreter?data=" + encodeURIComponent(q),
        ];
        function pull(i) {
          if (i >= urls.length || !osmb) return;
          fetch(urls[i])
            .then((r) => {
              if (!r.ok) throw new Error("overpass");
              return r.json();
            })
            .then((data) => {
              if (window.__buildingsAppear && window.__buildingsAppear.overpassMs == null) {
                window.__buildingsAppear.overpassMs = performance.now();
              }
              const els = (data && data.elements) || [];
              const items = [];
              els.forEach((el) => {
                const tags = el.tags || {};
                if (!tags.building && !tags["building:part"]) return;
                const ring = wayRing(el);
                if (!ring) return;
                items.push({
                  id: "osm-w" + el.id,
                  tags: tags,
                  ring: ring,
                  part: !!tags["building:part"],
                });
              });
              const parts = items.filter((it) => it.part);
              const features = [];
              items.forEach((it) => {
                if (
                  !it.part &&
                  parts.length &&
                  (isChurch(it.tags) || it.tags["building:parts"])
                ) {
                  const bb = ringBBox(it.ring);
                  let inside = 0;
                  parts.forEach((p) => {
                    const c = ringCentroid(p.ring);
                    if (
                      c[0] >= bb.minX &&
                      c[0] <= bb.maxX &&
                      c[1] >= bb.minY &&
                      c[1] <= bb.maxY
                    ) {
                      inside += 1;
                    }
                  });
                  if (inside >= 2) return;
                }
                const ring = footprintForRoof(it.ring, it.tags);
                const props = modelProperties(it.tags, ring);
                features.push({
                  type: "Feature",
                  id: it.id,
                  properties: props,
                  geometry: { type: "Polygon", coordinates: [ring] },
                });
                if (isChurch(it.tags)) {
                  features.push(churchCupola(it.ring, props.height, it.id));
                }
              });
              if (!osmb) return;
              if (!features.length) {
                if (!buildingTiles) {
                  buildingTiles = osmb.addGeoJSONTiles(BUILDING_TILES);
                  markBuildingsScene("tiles");
                }
                if (window.__buildingsAppear) {
                  window.__buildingsAppear.fallbackTiles = true;
                }
                return;
              }
              const fc = { type: "FeatureCollection", features: features };
              writeBuildingCache(fc);
              showDetailedBuildings(fc);
            })
            .catch(() => {
              if (i + 1 < urls.length) pull(i + 1);
              else if (osmb && !buildingTiles && !detailedLayer) {
                buildingTiles = osmb.addGeoJSONTiles(BUILDING_TILES);
                markBuildingsScene("tiles");
              }
            });
        }
        pull(0);
      }

      function showLuogoCard(luogo) {
        const card = document.getElementById("luogo-card");
        if (!card) return;
        card.style.setProperty("--luogo", coloreLuogo(luogo));
        card.classList.add("is-open");
        const kind = luogo.suolo
          ? "<p class='luogo-kind'>" + suoloLabel(luogo.suolo) + "</p>"
          : "";
        card.innerHTML =
          "<div class='luogo-card-head'><div><h2>" +
          luogo.nome +
          "</h2>" +
          kind +
          "</div><button type='button' class='luogo-close' id='luogo-close' aria-label='Chiudi'>×</button></div>" +
          listaEventi(luogo);
        const close = document.getElementById("luogo-close");
        if (close) {
          close.onclick = () => {
            hideLuogoCard();
            state.selectedId = null;
            paintState();
          };
        }
      }

      function hideLuogoCard() {
        const card = document.getElementById("luogo-card");
        if (card) {
          card.classList.remove("is-open");
          card.style.removeProperty("--luogo");
          card.innerHTML = "";
        }
      }

      function makeOsmb(onClick) {
        onLuogoClick = onClick;
        const box = document.getElementById("map");
        osmb = new OSMBuildings({
          container: "map",
          position: { latitude: 42.8544, longitude: 13.5762 },
          zoom: 16.0,
          minZoom: 15,
          maxZoom: 20,
          tilt: 45,
          rotation: -22,
          effects: ["shadows"],
          backgroundColor: "#efe8e0",
          fogColor: "#e8e0d8",
          highlightColor: "#ff4d00",
          style: { color: COLOR_CITTA },
          attribution: "© OpenStreetMap © OSM Buildings",
        });
        if (window.__buildingsAppear) {
          window.__buildingsAppear.osmbMs = performance.now();
        }
        osmb.addMapTiles("https://tile-a.openstreetmap.fr/hot/{z}/{x}/{y}.png");
        if (typeof osmb.setDate === "function") {
          osmb.setDate(new Date(2026, 8, 11, 16, 0, 0));
        }
        osmb.setTilt(45);
        osmb.setRotation(-22);
        osmb.setZoom(16.0);
        const cached = readBuildingCache();
        if (cached) {
          showDetailedBuildings(cached);
        } else {
          buildingTiles = osmb.addGeoJSONTiles(BUILDING_TILES);
          markBuildingsScene("tiles");
          addEventBeacons();
        }
        loadDetailedModels();
        osmb.on("change", syncEventMarks);
        osmb.on("resize", syncEventMarks);
        osmb.on("pointerup", (e) => {
          if (!onLuogoClick) return;
          const feats = e.features || [];
          for (let i = 0; i < feats.length; i++) {
            const raw = feats[i];
            const fid = String(raw && (raw.id != null ? raw.id : raw));
            const luogoId =
              buildingTint.toLuogo[fid] ||
              buildingTint.toLuogo[fid.replace(/^osm-w/i, "")];
            if (luogoId) {
              onLuogoClick(luogoById(luogoId));
              return;
            }
          }
          hideLuogoCard();
          state.selectedId = null;
          paintState();
        });
        window.setTimeout(() => {
          if (!osmb) return;
          osmb.setSize(box.clientWidth, box.clientHeight);
          syncEventMarks();
        }, 200);
      }

      function destroyOsmb() {
        buildingTiles = null;
        detailedLayer = null;
        eventLayer = null;
        eventMarkers = [];
        const marks = document.getElementById("event-marks");
        if (marks) marks.innerHTML = "";
        if (osmb && typeof osmb.destroy === "function") {
          try {
            osmb.destroy();
          } catch (err) {}
        }
        osmb = null;
        onLuogoClick = null;
      }

      function openForm(from) {
        state.formOpen = true;
        state.formFrom = from;
        paintState();
        const modal = document.getElementById("form-modal");
        if (modal) modal.classList.add("is-open");
      }
      function closeForm() {
        state.formOpen = false;
        state.formFrom = null;
        paintState();
        const modal = document.getElementById("form-modal");
        if (modal) modal.classList.remove("is-open");
      }

      function formModalHtml() {
        return (
          '<div class="modal" id="form-modal">' +
          '<div class="modal-card">' +
          "<h2>Proposta (stub)</h2>" +
          "<p>Qui andrà il form Web3Forms. Questo prototipo chiede solo <em>da dove</em> si apre, non i campi.</p>" +
          '<button type="button" id="close-form">Chiudi</button>' +
          "</div></div>"
        );
      }

      function renderA() {
        const app = document.getElementById("app");
        app.innerHTML =
          mapStageHtml() +
          '<div class="luogo-card" id="luogo-card"></div>' +
          formModalHtml();
        makeOsmb((luogo) => {
          state.selectedId = luogo.id;
          paintState();
          showLuogoCard(luogo);
        });
        document.getElementById("close-form").onclick = closeForm;
      }

      function renderB() {
        const app = document.getElementById("app");
        app.innerHTML =
          '<div class="b-wrap">' +
          '<div class="b-side">' +
          '<div class="b-head"><h1>Luoghi</h1><button type="button" id="b-proponi">Proponi un Evento</button></div>' +
          '<div id="b-list"></div></div>' +
          '<div class="b-map">' +
          mapStageHtml() +
          '<div class="luogo-card" id="luogo-card"></div></div></div>' +
          formModalHtml();
        const list = document.getElementById("b-list");
        LUOGHI.forEach((luogo) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "b-item";
          btn.dataset.id = luogo.id;
          const kind = pinKind(luogo);
          const meta =
            kind === "in-corso"
              ? "Evento in corso"
              : kind === "con-eventi"
                ? luogo.eventi.length + " Evento"
                : "Nessun Evento";
          btn.innerHTML =
            '<div class="name">' + luogo.nome + '</div><div class="meta">' + meta + "</div>";
          btn.onclick = () => selectB(luogo.id);
          list.appendChild(btn);
        });
        makeOsmb((luogo) => selectB(luogo.id));
        document.getElementById("b-proponi").onclick = () => openForm("intestazione");
        document.getElementById("close-form").onclick = closeForm;
      }

      function selectB(id) {
        state.selectedId = id;
        paintState();
        document.querySelectorAll(".b-item").forEach((el) => {
          el.classList.toggle("is-on", el.dataset.id === id);
        });
        const luogo = luogoById(id);
        if (osmb) {
          osmb.setPosition({ latitude: luogo.lat, longitude: luogo.lng });
          osmb.setZoom(17.2);
        }
        showLuogoCard(luogo);
      }

      function renderC() {
        const app = document.getElementById("app");
        app.innerHTML =
          mapStageHtml() +
          '<div class="c-hint">Tocca un edificio colorato</div>' +
          '<div class="sheet" id="sheet"></div>' +
          formModalHtml();
        makeOsmb((luogo) => {
          state.selectedId = luogo.id;
          paintState();
          const sheet = document.getElementById("sheet");
          sheet.classList.add("is-open");
          sheet.innerHTML =
            "<h2>" +
            luogo.nome +
            "</h2>" +
            listaEventi(luogo) +
            '<button type="button" id="c-proponi">Proponi un Evento in questo Luogo</button>' +
            '<button type="button" class="ghost" id="c-nuovo">Proponi su un Luogo nuovo</button>';
          document.getElementById("c-proponi").onclick = () =>
            openForm("luogo:" + luogo.id);
          document.getElementById("c-nuovo").onclick = () => openForm("luogo-nuovo");
        });
        document.getElementById("close-form").onclick = closeForm;
      }

      function render() {
        destroyOsmb();
        buildingTint.toLuogo = {};
        buildingTint.color = {};
        window.__buildingsAppear = emptyAppear(performance.now());
        state.variant = currentVariant();
        document.body.dataset.variant = state.variant;
        if (state.variant === "A") renderA();
        else if (state.variant === "B") renderB();
        else renderC();
        paintState();
      }

      document.getElementById("proponi").onclick = () => openForm("header");
      window.addEventListener("resize", () => {
        const box = document.getElementById("map");
        if (osmb && box) osmb.setSize(box.clientWidth, box.clientHeight);
      });
      render();
    </script>
  </body>
